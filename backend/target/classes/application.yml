server:
  port: 8080

spring:
  application:
    name: campusdinga-backend
  datasource:
    url: jdbc:h2:mem:campusdingadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

campusdinga:
  jwt:
    secret: campusdingaSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLongSoItIsVerySecure123456
    expiration-ms: 86400000 # 24 hours
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-3-5-sonnet-20241022}
